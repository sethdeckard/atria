version: "2"

linters:
  # The default set includes errcheck, govet, ineffassign, staticcheck, and
  # unused. Staticcheck includes the gosimple checks.
  enable:
    - gocritic
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    # Ignore unchecked errors from common standard-library cleanup and
    # printing functions.
    presets:
      - std-error-handling
    paths:
      - internal/terminal/iterm/proto

formatters:
  enable:
    - gofmt
    - goimports
