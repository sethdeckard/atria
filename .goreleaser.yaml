version: 2

builds:
  - main: .
    binary: atria
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - repository:
      owner: sethdeckard
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/sethdeckard/atria
    description: "Agent multiplexer for your terminal"
    directory: Casks
    binaries:
      - atria
    # The released macOS binaries are unsigned and un-notarized, so Gatekeeper
    # blocks them without this. Remove the hook if Developer ID signing and
    # notarization are ever adopted. The OS.mac? guard matters: this cask also
    # installs on Linux, where /usr/bin/xattr does not exist.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/atria"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
